name: Nightly database backup

# Dumps the shop's Supabase data every night, encrypts it, and keeps it as a
# workflow artifact for 90 days. The dump is encrypted because artifacts of a
# public repository can be downloaded by anyone signed in to GitHub.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Session-pooler connection string from Supabase
#                       (Project Settings → Database → Connection string → Session pooler).
#                       GitHub runners have no IPv6, so the direct db.<ref>.supabase.co host won't work.
#   BACKUP_PASSPHRASE   A long random passphrase. Store a copy somewhere safe; without it
#                       the backups cannot be decrypted.
#
# Restore: gpg --decrypt sukie-backup-<date>.sql.gz.gpg | gunzip | psql "<target db url>"

on:
  schedule:
    - cron: "30 21 * * *" # 00:30 in Addis Ababa (UTC+3)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets to enable backups."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::BACKUP_PASSPHRASE must be at least 20 characters."
            exit 1
          fi

      - name: Dump, compress and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backup
          FILE="backup/sukie-backup-$(date -u +%Y-%m-%dT%H%MZ).sql.gz.gpg"
          # pg_dump 17 can dump Supabase's Postgres 15 and 17 servers.
          docker run --rm -e DB_URL="$SUPABASE_DB_URL" postgres:17-alpine \
            sh -c 'pg_dump "$DB_URL" --schema=public --no-owner --no-privileges --quote-all-identifiers' \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase-fd 3 --output "$FILE" 3<<<"$BACKUP_PASSPHRASE"
          SIZE=$(stat -c %s "$FILE")
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Backup is suspiciously small ($SIZE bytes)."
            exit 1
          fi
          echo "Encrypted backup: $FILE ($SIZE bytes)"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: sukie-db-backup-${{ github.run_id }}
          path: backup/*.gpg
          retention-days: 90
          if-no-files-found: error
